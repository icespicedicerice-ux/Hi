name: Build Quest APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: "4.3"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "build-tools;34.0.0" "platforms;android-34" "cmake;3.10.2.4988893" "ndk;23.2.8568313"

      - name: Install Godot and export templates
        run: |
          BASE=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          wget -q $BASE/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          wget -q $BASE/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          unzip -q Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          sudo mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          unzip -q Godot_v${GODOT_VERSION}-stable_export_templates.tpz -d tpl
          mv tpl/templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/

      - name: Install OpenXR Vendors plugin (3.x line, for Godot 4.3)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          URL=$(curl -s -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/GodotVR/godot_openxr_vendors/releases \
            | jq -r '[.[] | select(.tag_name|test("^3\\."))][0].assets[] | select(.name|test("zip$")) | select(.name|test("demo|sample";"i")|not) | .browser_download_url' | head -1)
          echo "Plugin URL: $URL"
          curl -sL -o vendors.zip "$URL"
          unzip -q vendors.zip -d vendors
          mkdir -p addons
          cp -r "$(find vendors -type d -name godotopenxrvendors | head -1)" addons/
          ls addons/godotopenxrvendors

      - name: Android build template
        run: |
          mkdir -p android/build
          unzip -q ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/android_source.zip -d android/build
          echo -n "${GODOT_VERSION}.stable" > android/.build_version
          touch android/build/.gdignore

      - name: Editor settings and debug keystore
        run: |
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-${GODOT_VERSION}.tres <<EOT
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_HOME"
          EOT
          keytool -genkey -v -keystore $PWD/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 9999 -dname "CN=Android Debug,O=Android,C=US"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$PWD/debug.keystore" >> $GITHUB_ENV
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> $GITHUB_ENV
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> $GITHUB_ENV

      - name: Import and export APK
        run: |
          mkdir -p build
          godot --headless --import || true
          godot --headless --export-debug "Quest" build/HollowBlade.apk

      - uses: actions/upload-artifact@v4
        with:
          name: HollowBlade-apk
          path: build/HollowBlade.apk
